spring.application.name=glivt
server.address=0.0.0.0
server.port=8085
# ---------------------------------------------------------------------
# Datasource (MySQL). Values come from the environment - never hard-code
# production credentials. See .env.example.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/glivits?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Flyway owns the schema; Hibernate never mutates it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------
# Security / JWT
# ---------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:PTgFYDhRcBIF3yBUKLfBdm36xERAqx3mJv6qIFw6gZ2}
app.jwt.access-token-ttl-minutes=${APP_JWT_ACCESS_TTL_MINUTES:15}
app.jwt.refresh-token-ttl-days=${APP_JWT_REFRESH_TTL_DAYS:30}
app.jwt.issuer=glivt

app.auth.single-session=${APP_AUTH_SINGLE_SESSION:false}
app.auth.login-max-attempts=${APP_AUTH_LOGIN_MAX_ATTEMPTS:5}
app.auth.login-window-minutes=${APP_AUTH_LOGIN_WINDOW_MINUTES:15}

# CORS allowed origins (comma-separated). Use explicit origins in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# ---------------------------------------------------------------------
# AI configuration
#
# The backend talks ONLY to the Python AI service; that service owns all Ollama
# communication, so there is one model configuration and one availability check.
# The Ollama values below are reported by diagnostics and are never dialled
# directly from here.
#
# There is deliberately NO default internal token. Production fails to start
# without one (see AiConfigurationValidator); development may opt in to a
# documented local token with app.ai.allow-dev-token=true.
# ---------------------------------------------------------------------
app.ai.python-service.url=${AI_PYTHON_SERVICE_URL:http://127.0.0.1:8001}
app.ai.python-service.token=${AI_INTERNAL_TOKEN:}
app.ai.python-service.connect-timeout-ms=${AI_PYTHON_SERVICE_CONNECT_TIMEOUT_MS:2000}
app.ai.python-service.timeout-ms=${AI_PYTHON_SERVICE_TIMEOUT_MS:10000}
app.ai.python-service.chat-timeout-ms=${AI_CHAT_TIMEOUT_MS:30000}
app.ai.python-service.embedding-timeout-ms=${AI_EMBEDDING_TIMEOUT_MS:30000}
app.ai.python-service.health-timeout-ms=${AI_HEALTH_TIMEOUT_MS:3000}
# Outside production, an unset token falls back to the documented local dev
# token, which the Python AI service defaults to as well - so a fresh clone
# has working AI without any manual setup. Production ignores this and
# refuses to start without an explicit token (AiConfigurationValidator).
app.ai.allow-dev-token=${AI_ALLOW_DEV_TOKEN:true}

app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.ai.ollama.model=${OLLAMA_MODEL:qwen3.5:0.8b}
app.ai.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

# Request limits (prompt-injection and abuse surface reduction)
app.ai.limits.max-chat-message-chars=${AI_MAX_CHAT_MESSAGE_CHARS:2000}
app.ai.limits.max-chat-history-messages=${AI_MAX_CHAT_HISTORY:12}
app.ai.limits.max-image-bytes=${AI_MAX_IMAGE_BYTES:5242880}
app.ai.limits.chat-requests-per-minute=${AI_CHAT_RPM:20}
app.ai.limits.expensive-requests-per-minute=${AI_EXPENSIVE_RPM:30}

# Circuit breaker: stop hammering a dead AI service on every GPS packet.
app.ai.circuit-breaker.enabled=${AI_CIRCUIT_BREAKER_ENABLED:true}
app.ai.circuit-breaker.failure-threshold=${AI_CIRCUIT_BREAKER_THRESHOLD:5}
app.ai.circuit-breaker.open-millis=${AI_CIRCUIT_BREAKER_OPEN_MS:30000}

# Asynchronous AI evaluation outbox.
app.ai.outbox.poll-ms=${AI_OUTBOX_POLL_MS:2000}
app.ai.outbox.requeue-ms=${AI_OUTBOX_REQUEUE_MS:60000}

# Scheduled AI jobs (leader-elected across instances).
app.ai.jobs.enabled=${AI_JOBS_ENABLED:true}
app.ai.jobs.retention-days=${AI_JOBS_RETENTION_DAYS:120}


# ---------------------------------------------------------------------
# Demo mode. Guarded so demo data and demo login never mix with production.
# ---------------------------------------------------------------------
app.demo-mode.enabled=${APP_DEMO_MODE:true}
app.seed-demo=${APP_SEED_DEMO:${app.demo-mode.enabled:true}}
app.demo-login.enabled=${APP_DEMO_LOGIN_ENABLED:${app.demo-mode.enabled:true}}

# ---------------------------------------------------------------------
# OpenAPI / Swagger
# ---------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------
# Actuator (health only exposed by default)
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

# Do not log sensitive payloads.
logging.level.org.springframework.security=INFO

# Rate Limiting Configuration (Bucket4j)
app.rate-limiting.enabled=true
app.rate-limiting.login.limit=5
app.rate-limiting.ai-chat.limit=20
app.rate-limiting.vehicle-location.limit=60
app.rate-limiting.general.limit=100
